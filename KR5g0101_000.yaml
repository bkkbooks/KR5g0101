body:
  text: 靈寶鍊度五仙安靈鎮神黃繒章法洞玄靈寶赤帝先生至真大法師臣某甲稽首上言上上上一氣一氣上上上無極無頂無色無光遼廓至真大道元始天尊三十二帝太上大道君玉陛下臣承元始大化諸天開宥幽牢地獄三塗五苦餓鬼死魂並出長夜一切光明皇道既陶死骸還人三界清肅土府太平請以滅度託尸太陰寄形地官功微德少未蒙者皆女青符命隨所統領安慰撫恤供給營衛不得搖動使還託生人身是時諸天大聖衆無極太上大道君五老上帝飛天神王南昌上宫長生司馬好生真君諸元君靈妃玄和玉女諸真人七千二百四十童子同時彈指普告諸天諸地諸水日月星宿璇璣玉衡五帝五嶽諸靈山地府三官九署十二河源洞極洞淵無高無下無深無遠無邊無際無大無小無窮無極一切神靈咸使聞知金篆玉書以付玄和玉女約以今為新奉大法不得有偏雖經天地大運正文甚明今承女青上宫舊典申明聖道為某郡某縣鄉里清信弟子男女某甲年若干歲本命丙午赤帝領籍七月受氣丹天稟先功未滿履在穢世塵濁所染應在滅度託命太陰寄形土官今於中天某鄉里中安宫立室以為住止功微德少未能自還今為土府所見馳逼不相容安魂飛魄揚尸形無寄謹依明真大法金篆玉書之文上請諸天自然玉字女青符命告下某天中九土靈官安鎮某甲身形骸地宅請下九氣青天蒼靈生神真人從東嶽仙人乘蒼龍九千萬騎九氣天文青帝女青符命下東鄉九土諸靈官開長夜之府九幽地獄拔出某甲魂神還付故宅應轉者轉應度者度應生者生應還者還未得生者明安尸形撫恤營衛不得搖動如女青文以青紋之繒九十尺或九尺以奉九氣天君為拔度之信又請下三氣丹天赤靈生神真人從南嶽仙人乘赤龍三千萬騎齎三氣天文赤帝女青符命下南鄉九土諸靈官開長夜之府九幽地獄拔出某甲魂神還付故宅應轉者轉應度者度應生者生應還者還未得生者明安尸形撫恤營衛不得搖動如女青文以赤紋之繒三十尺或三尺以奉三氣天君為拔度之信又請下一氣黃天黃靈主魁神鈕總生真人從中嶽仙人乘黃龍萬二千騎齎一氣天文黃帝女青符命下中央無極無窮無高無下無深無遠無邊無際土府一切諸靈官開長夜之府九幽地嶽拔出某甲魂神還付故宅應轉者轉應度者度應生者生應還者還未得生者明安尸形撫恤營衛不得搖動如女青文以黃紋之繒一百二十尺或一十二尺以奉一氣天君為拔度之信又請下七氣素天白靈生神真人從西嶽仙人乘白龍七千萬騎齎七氣天文白帝女青符命下西鄉九土諸靈官開長夜之府九幽地嶽拔出某甲魂神還付故宅應轉者轉應度者度應生者生應還者還未得生者明安尸形撫恤營衛不得搖動如女青文以白紋之繒七十尺或七尺以奉七氣天君為拔度之信又請下五氣玄天玄靈生神真人從北嶽仙人乘玄龍五千萬騎齎五氣天文黑帝女青符命下北鄉九土諸靈官開長夜之府九幽地獄拔出某甲魂神還付故宅應轉者轉應度者度應生者生應還者還未得生者明安尸形撫恤營衛不得搖動如女青文以黑紋之繒五十尺或五尺以奉五氣天君為拔度之信又以上金五兩或鐵五十斤以奉五帝安鎮五方某甲今應在開度之例九土地官各依部界經營侍衛供給有無令形安神守魄不揚散須待功成當反舊宅受津而生願五帝哺飴太和元精導氣養神飲以三光玄注洪泉玉芝自充光華早瑩澧溢早香魂遊上清衣食自然下附宫宅與景合并不相遠離同受化生今日大慶度人無量開度一切莫不咸從尊承舊法列功諸天有違女青削官罰形盟如舊制金龍驛行謹以表聞伏須告報臣某誠惶誠恐死罪死罪稽首再拜以聞空三行臣姓某屬郡縣鄉里上上上一氣一氣上上上無極無頂無色無光遼廓至真大道元始天尊三十二帝太上大道君太清玉陛下太歲某甲子某月某日某時於某處黃素章表一通金龍上呈女青舊典以朱筆書此文於黃繒上師於亡人所在子時北向燒五香火施安五鎮而奏上黃繒章露文一宿明日平旦各埋文方面以鎮神安形行之者女青文曰九祖幽魂皆即出長夜身入光明三官判對天堂記名供其厨飯三十二年皆還其故形而更生也未得還者形骸故宅則為五帝侍衛地祇營護安慰撫恤無有搖動不出百年無不化生而得還於人道也三界簿録其有分明智者洞其至理考其善惡緣對報應明不虛言愚者任命謂之不然三官塗炭甚可哀哉天真皇人曰昔赤明天中有道士姓鄭字仁安功德未滿死於常山北戎之阿其子仲明師玄和先生以此文鎮仁安尸形宫宅三十年仁安被度應還人中而為獵人所燒形骸鬱然而起今為上宫南帝老君得道之迹今題太極上宫南軒甚有分明也天真皇人曰昔善忍國有道士姓𤨆字信然師無常童子受靈寶滅度升天之傳功德未足死於青元山中埋尸於流生之洲無常童子以此文鎮其尸形百年而遇洪水所蕩於此化生今受號為元靈老君南宫書其道迹在紫微之館天真皇人曰昔棄賢世界有道士姓浩字敷明少好山水棄家遠遊功德未滿死於地鏡山下其子少信就北郭先生受此文鎮敷明尸形七百年被水火鍊度而得還人中後師黑文子受升天之傳今為玄老之帝南宫今書其道迹在北元玄窗天真皇人曰中元天中南浮黎世界有道士姓王字度明少出遊學從屠真公受五篇文升仙之傳功德未足死於東山廣靈之阿其子景秀詣戴仲君受此文以鎮尸形九十年遭東山大荒人民掘土覓食發其死尸而即化生後道成升天為景霄真人天真皇人曰此諸君皆積學滅度道業垂成而得受此文以還生人中皆超虛步空上升金闕受號自然也其並非悠遠世人所不能明考其近衍門子師夜光高丘子師石公洪崖先生師金母並受靈寶滅度五鍊之法升天之傳衍門死於漁陽洛縣長丘山高丘子死於中山聞喜縣高附山洪崖先生死於武威姑蘇縣浪山中並受此文以鎮其墓衍門子四十年墓崩而形化後入蒙山大洞黃金之庭受書為仙卿高丘子七十二年墓為人所發腐棺而形飛今為中嶽真人洪崖先生一百二十年墓開尸形飛騰受書為青城真人此之諸賢並受滅度之法升天之傳鎮靈道而得崇虛淩清策空高霞遊宴紫微受號真人也此之近事非復悠遠之傳元始天王令披元始之寶藏以告太極上仙遇之者將前生萬劫録名上清應得仙道也諸天男女可不承女青之音祕而寶之焉靈寶錬度五仙安靈鎮神黃繒章法
